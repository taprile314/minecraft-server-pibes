services:
  mc:
    image: itzg/minecraft-server
    container_name: mc-server-pibes
    tty: true
    stdin_open: true
    ports:
      - "25569:25569"
      - "24454:24454/udp" # Simple Voice Chat default port — keep separate from SERVER_PORT (mod warns UDP-on-server-port can crash query)
    environment:
      TZ: "America/Argentina/Buenos_Aires"
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      MEMORY: "4G"
      USE_MEOWICE_FLAGS: "TRUE"
      ONLINE_MODE: "FALSE"
      OPS: "gordo420"
      DIFFICULTY: "hard"
      SERVER_PORT: 25569
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_PROJECTS: |
        fabric-api
        ping-wheel
        skinsrestorer
        lithium
        ferrite-core
        appleskin
        spark?
        simple-voice-chat
        emotecraft:beta
        player-animation-library
        cicada
        online-emotes:beta
        headpat
        datapack:tree-vein-miner
        datapack:ly-graves
        datapack:afk-display
        datapack:explorify
        datapack:dungeons-and-taverns
        datapack:terralith
        datapack:towns-and-towers
        datapack:structory
        datapack:structory-towers
        datapack:ati-structures-vanilla-edition
        datapack:health-indicator
        datapack:spawn-animations
        datapack:vanilla-backpacks
        fastghast
    volumes:
      - ./data:/data
    restart: unless-stopped
  discord-notifier:
    image: python:3.12-alpine
    container_name: mc-discord-notifier
    working_dir: /app
    environment:
      TZ: "America/Argentina/Buenos_Aires"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data/logs:/data/logs:ro
    env_file:
      - .env
    command: sh -c "pip install --no-cache-dir --quiet requests && python -u scripts/discord_notify.py"
    depends_on:
      - mc
    restart: unless-stopped
  backup:
    image: itzg/mc-backup
    container_name: mc-backup
    environment:
      TZ: "America/Argentina/Buenos_Aires"
      BACKUP_METHOD: "restic"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD}"
      RESTIC_REPOSITORY: "/backups"
      PRUNE_RESTIC_RETENTION: "--keep-within 7d"
      # CRON_SCHEDULE ignores TZ (itzg/mc-backup runs its cron in UTC unless /etc/localtime
      # is bind-mounted, which isn't viable on Windows Docker Desktop). 03/09/15/21 UTC = 00/06/12/18 GMT-3.
      CRON_SCHEDULE: "0 3,9,15,21 * * *"
      RCON_HOST: "mc"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      DISCORD_MENTION_PREFIX: "${DISCORD_MENTION_PREFIX}"
      POST_BACKUP_SCRIPT_FILE: "/scripts/backup_notify.sh"
    volumes:
      - ./data:/data:ro
      - ./scripts:/scripts:ro
      - D:/mc-backups-pibes-restic:/backups
    depends_on:
      - mc
    restart: unless-stopped
